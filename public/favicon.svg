<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Portfolio icon">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cc8ff"/>
      <stop offset="100%" stop-color="#3de0c8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cc8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="26" fill="#07101d"/>

  <!-- Edges -->
  <line x1="64" y1="64" x2="21" y2="27"  stroke="#5cc8ff" stroke-width="2.4" stroke-opacity="0.55"/>
  <line x1="64" y1="64" x2="107" y2="27" stroke="#3de0c8" stroke-width="2.4" stroke-opacity="0.55"/>
  <line x1="64" y1="64" x2="21" y2="101" stroke="#a78bfa" stroke-width="2.4" stroke-opacity="0.55"/>
  <line x1="64" y1="64" x2="107" y2="101" stroke="#ffbd59" stroke-width="2.4" stroke-opacity="0.55"/>

  <!-- Satellite nodes -->
  <circle cx="21"  cy="27"  r="9.5" fill="#07101d" stroke="#5cc8ff" stroke-width="2.5"/>
  <circle cx="107" cy="27"  r="9.5" fill="#07101d" stroke="#3de0c8" stroke-width="2.5"/>
  <circle cx="21"  cy="101" r="9.5" fill="#07101d" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="107" cy="101" r="9.5" fill="#07101d" stroke="#ffbd59" stroke-width="2.5"/>

  <!-- Centre glow -->
  <circle cx="64" cy="64" r="32" fill="url(#halo)"/>

  <!-- Centre node ring -->
  <circle cx="64" cy="64" r="21" fill="#0c1829" stroke="url(#cg)" stroke-width="3"/>

  <!-- Centre pinned dot -->
  <circle cx="64" cy="64" r="7" fill="url(#cg)"/>
</svg>
