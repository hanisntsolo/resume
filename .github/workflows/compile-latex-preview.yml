name: Compile LaTeX + Build Timeline (Preview/Feature Branches)

on:
  push:
    branches-ignore:
      - hanisntsolo
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Create output directory
        run: mkdir -p output

      - name: Set up LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: hanisntsolo-resume.tex
          extra_system_packages: "inkscape"
          compiler: xelatex
          args: -shell-escape -output-directory=output

      - name: Install Node dependencies
        run: npm install

      - name: Build React Timeline (Preview)
        run: npm run build:preview

      - name: Copy React app build to output
        run: cp -r dist/* output/

      - name: Add CNAME file for Custom Domain
        run: echo "resume.hanisntsolo.com" > output/CNAME
        
      - name: List files in output directory
        run: find output -type f | head -20

      - name: Deploy to GitHub Pages (Preview)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: ./dev
          cname: resume.hanisntsolo.com
